<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MONCHER - Executive Master Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lato', sans-serif; background: #FDFBF7; color: #1A1A1A; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #FAF6F0; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="loginOverlay" class="fixed inset-0 bg-[#58111A]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-[#FDFBF7] border-2 border-[#C5A059] w-full max-w-md p-8 shadow-2xl rounded-sm">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
        <p class="text-xs text-[#C5A059] uppercase tracking-widest font-bold mt-1">Executive Analytics Portal</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-[#58111A] uppercase mb-1">Username</label>
          <input type="text" id="loginUser" required placeholder="ADMIN" class="w-full bg-[#FAF6F0] border border-[#C5A059]/60 px-3 py-2 text-sm font-bold text-[#58111A] outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-[#58111A] uppercase mb-1">Password</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-[#FAF6F0] border border-[#C5A059]/60 px-3 py-2 text-sm font-bold text-[#58111A] outline-none">
        </div>
        <button type="submit" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-2.5 text-xs font-bold uppercase tracking-widest hover:bg-[#3D0B12]">
          Authenticate & Access
        </button>
      </form>
    </div>
  </div>

  <div id="dashboardApp" class="hidden flex-1 flex flex-col">
    <header class="bg-[#FDFBF7] border-b-2 border-[#C5A059]/40 px-6 py-4 flex justify-between items-center shadow-sm">
      <div>
        <h1 class="text-2xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
        <p class="text-[10px] text-[#C5A059] uppercase tracking-widest font-bold">Master Analytics & Performance Overview</p>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-xs font-bold text-[#58111A] bg-[#FAF6F0] px-3 py-1 border border-[#C5A059]/40">User: ADMIN</span>
        <button onclick="location.reload()" class="text-xs text-red-700 font-bold border border-red-700 px-3 py-1 hover:bg-red-50 uppercase tracking-wider">Logout</button>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-[#FDFBF7] border-2 border-[#C5A059] p-4 shadow-sm space-y-2">
          <p class="text-[11px] font-bold text-[#C5A059] uppercase tracking-wider">Total Sales Revenue</p>
          <h3 id="statRevenue" class="text-2xl font-bold text-[#58111A]">₹0.00</h3>
        </div>
        <div class="bg-[#FDFBF7] border border-[#C5A059]/40 p-4 shadow-sm space-y-2">
          <p class="text-[11px] font-bold text-[#C5A059] uppercase tracking-wider">Total Orders Served</p>
          <h3 id="statOrders" class="text-2xl font-bold text-[#58111A]">0</h3>
        </div>
        <div class="bg-[#FDFBF7] border border-[#C5A059]/40 p-4 shadow-sm space-y-2">
          <p class="text-[11px] font-bold text-[#C5A059] uppercase tracking-wider">Avg. Order Value (AOV)</p>
          <h3 id="statAov" class="text-2xl font-bold text-[#58111A]">₹0.00</h3>
        </div>
      </div>

      <div class="bg-[#FDFBF7] border border-[#C5A059]/40 p-5 shadow-sm space-y-4">
        <h3 class="text-base font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-2">Recent Shift Transactions</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-[#FAF6F0] border-b border-[#C5A059]/40 text-[#58111A] uppercase font-bold">
                <th class="p-3">Order ID</th>
                <th class="p-3">Date</th>
                <th class="p-3">Table</th>
                <th class="p-3">Amount</th>
                <th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody" class="divide-y divide-[#C5A059]/20 font-bold"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      var u = document.getElementById('loginUser').value.trim();
      var p = document.getElementById('loginPass').value.trim();
      if (u === "ADMIN" && p === "ADMIN") {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('dashboardApp').classList.remove('hidden');
        loadAnalytics();
      } else {
        alert('Invalid credentials.');
      }
    }

    function loadAnalytics() {
      google.script.run
        .withSuccessHandler(function(orders) {
          var totalRev = orders.reduce(function(sum, o) { return sum + (o.total || 0); }, 0);
          var totalCount = orders.length;
          var aov = totalCount > 0 ? (totalRev / totalCount) : 0;

          document.getElementById('statRevenue').innerText = '₹' + totalRev.toLocaleString('en-IN', {minimumFractionDigits: 2});
          document.getElementById('statOrders').innerText = totalCount;
          document.getElementById('statAov').innerText = '₹' + aov.toFixed(2);

          var tbody = document.getElementById('ordersTableBody');
          tbody.innerHTML = orders.slice(-20).reverse().map(function(o) {
            return '<tr>' +
              '<td class="p-3 text-[#58111A]">' + o.id + '</td>' +
              '<td class="p-3">' + o.date + '</td>' +
              '<td class="p-3">#' + o.table + '</td>' +
              '<td class="p-3">₹' + o.total.toFixed(2) + '</td>' +
              '<td class="p-3"><span class="bg-[#58111A] text-white px-2 py-0.5 text-[10px]">' + o.status + '</span></td>' +
            '</tr>';
          }).join('');
        })
        .getMasterAnalytics();
    }
  </script>
</body>
</html>
