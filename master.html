<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Cher - Admin Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #D4AF37; --bg: #0C0C0E; --surface: #141417;
            --card: #1D1D22; --border: #282830; --text: #FFF; --muted: #8E8E9A;
            --green: #22C55E; --blue: #3B82F6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Login Overlay */
        #loginOverlay {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 32px; border-radius: 16px; width: 100%; max-width: 360px;
        }
        .login-card h2 { color: var(--primary); text-align: center; margin-bottom: 24px; font-size: 1.4rem; }
        .form-control { margin-bottom: 16px; }
        .form-control label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
        .form-control input {
            width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border);
            color: #FFF; border-radius: 8px; outline: none; font-size: 0.95rem;
        }
        .form-control input:focus { border-color: var(--primary); }
        .btn-submit {
            width: 100%; padding: 12px; background: var(--primary); border: none;
            color: #000; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 8px;
        }

        /* Dashboard Layout */
        #dashboard { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .metric-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 24px; border-radius: 14px; position: relative; overflow: hidden;
        }
        .metric-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .metric-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .metric-val { font-size: 2.2rem; font-weight: 700; color: #FFF; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>Admin Portal</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-control">
                    <label>Username</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="form-control">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
                <p id="errorMsg" style="color:#EF4444; font-size:0.8rem; margin-top:10px; display:none; text-align:center;">Invalid Credentials</p>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard">
        <div class="top-bar">
            <div>
                <h1 style="font-size: 1.6rem; color: var(--primary);">Executive Analytics</h1>
                <p style="color: var(--muted); font-size: 0.85rem;">Mon Cher Real-time Performance Overview</p>
            </div>
            <button onclick="logout()" style="background:transparent; border:1px solid #EF4444; color:#EF4444; padding:8px 16px; border-radius:8px; cursor:pointer;">Logout</button>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Today's Revenue</div>
                <div class="metric-val" id="todayRev">₹0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Orders</div>
                <div class="metric-val" id="todayOrders">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Cash Revenue</div>
                <div class="metric-val" id="cashRev">₹0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Online (Razorpay)</div>
                <div class="metric-val" id="rzpRev">₹0</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxkwNfmiY6-zlj2cVmet56-o2S4O-n9skVIuBGVN-wZxXAl2NQwlI_7Cbu4Nej45Ig8/exec";
        const AUTH_USER = "ADMIN";
        const AUTH_PASS = "ADMIN";

        document.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("isAdminLoggedIn") === "true") showDashboard();
        });

        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById("username").value.trim() === AUTH_USER && document.getElementById("password").value.trim() === AUTH_PASS) {
                sessionStorage.setItem("isAdminLoggedIn", "true");
                showDashboard();
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        function showDashboard() {
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadAnalytics();
        }

        function logout() { sessionStorage.removeItem("isAdminLoggedIn"); location.reload(); }

        async function loadAnalytics() {
            const res = await fetch(`${API_URL}?action=getAdminAnalytics`);
            const json = await res.json();
            const a = json.analytics;
            document.getElementById('todayRev').innerText = `₹${a.todayRevenue}`;
            document.getElementById('todayOrders').innerText = a.todayOrdersCount;
            document.getElementById('cashRev').innerText = `₹${a.cashRevenue}`;
            document.getElementById('rzpRev').innerText = `₹${a.razorpayRevenue}`;
        }
    </script>
</body>
</html>
