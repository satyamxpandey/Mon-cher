<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Executive Admin - Moncher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FDFBF7] p-8 text-[#1A1A1A] font-sans">
  <div class="max-w-4xl mx-auto space-y-8">
    <div class="border-b-2 border-[#C5A059]/40 pb-4">
      <h1 class="font-serif text-3xl font-bold text-[#58111A] uppercase">Executive Master Admin</h1>
      <p class="text-xs text-[#1A1A1A]/70">Financial Settlement & Operational Control</p>
    </div>

    <!-- Analytics Cards -->
    <div class="grid grid-cols-3 gap-6">
      <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-6">
        <p class="text-[10px] text-[#C5A059] uppercase font-bold">Total Sales Today</p>
        <p class="font-serif text-2xl font-bold text-[#58111A] mt-1">₹42,850.00</p>
      </div>
      <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-6">
        <p class="text-[10px] text-[#C5A059] uppercase font-bold">Total Orders</p>
        <p class="font-serif text-2xl font-bold text-[#58111A] mt-1">68</p>
      </div>
      <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-6">
        <p class="text-[10px] text-[#C5A059] uppercase font-bold">Shift Status</p>
        <p class="font-serif text-lg font-bold text-emerald-700 mt-1">OPEN</p>
      </div>
    </div>

    <!-- Settlement Box -->
    <div class="bg-[#FAF6F0] border-2 border-[#C5A059] p-8 space-y-4">
      <h2 class="font-serif text-xl font-bold text-[#58111A]">Manual Shift Settlement (Day End)</h2>
      <p class="text-xs text-[#1A1A1A]/70">Executing Day End will lock active POS registers, finalize daily revenue ledgers, and reset kitchen order sequences.</p>
      <button onclick="alert('Business Day Successfully Closed!')" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-6 py-3 text-xs uppercase font-bold tracking-widest hover:bg-[#3D0B12]">
        🔴 Close Business Day
      </button>
    </div>
  </div>
</body>
</html>
