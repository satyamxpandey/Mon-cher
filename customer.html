<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Cher - Order Menu</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root { --gold: #D4AF37; --bg: #121212; --card: #1E1E1E; --text: #F5F5F5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 100px; }
        .header { text-align: center; padding: 20px; border-bottom: 2px solid var(--gold); }
        .header img { width: 140px; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .menu-card { background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .item-price { color: var(--gold); font-weight: bold; }
        .btn-add { background: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .cart-footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 2px solid var(--gold); padding: 15px; text-align: center; }
        .btn-pay { background: var(--gold); border: none; color: #000; width: 100%; max-width: 400px; padding: 12px; font-weight: bold; font-size: 1rem; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" alt="Mon Cher">
    </div>
    <div class="container" id="menuContainer">Loading menu...</div>

    <div class="cart-footer">
        <div>Total: <span id="totalDisplay" style="color:var(--gold); font-weight:bold;">₹0</span></div>
        <button class="btn-pay" onclick="payNow()">PAY & PLACE ORDER</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxkwNfmiY6-zlj2cVmet56-o2S4O-n9skVIuBGVN-wZxXAl2NQwlI_7Cbu4Nej45Ig8/exec";
        const RAZORPAY_KEY = "rzp_test_TURMp23SkIADHg";
        let cart = [], total = 0;

        async function fetchMenu() {
            const res = await fetch(`${API_URL}?action=getMenu`);
            const json = await res.json();
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            json.data.forEach(item => {
                if (item.Is_Available) {
                    container.innerHTML += `
                        <div class="menu-card">
                            <div>
                                <div><strong>${item.Name}</strong></div>
                                <div class="item-price">₹${item.Price}</div>
                            </div>
                            <button class="btn-add" onclick="addToCart('${item.Name}', ${item.Price})">+ ADD</button>
                        </div>`;
                }
            });
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            total += price;
            document.getElementById('totalDisplay').innerText = `₹${total}`;
        }

        function payNow() {
            if (total === 0) return alert("Please add items first.");
            const options = {
                "key": RAZORPAY_KEY,
                "amount": total * 100,
                "currency": "INR",
                "name": "Mon Cher Cafe",
                "handler": function (response) { saveOrder(response.razorpay_payment_id); },
                "theme": { "color": "#D4AF37" }
            };
            new Razorpay(options).open();
        }

        async function saveOrder(payId) {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "createOrder", source: "QR", tableNo: "T-01",
                    items: cart, totalAmount: total, paymentMode: "Razorpay",
                    paymentStatus: "Paid", razorpayPaymentId: payId
                })
            });
            alert("Order sent to Kitchen!");
            cart = []; total = 0;
            document.getElementById('totalDisplay').innerText = `₹0`;
        }
        fetchMenu();
    </script>
</body>
</html>
