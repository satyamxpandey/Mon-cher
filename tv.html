<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Status Display - MONCHER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lato', sans-serif; background: #FDFBF7; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #FAF6F0; }
  </style>
</head>
<body class="h-screen p-8 flex flex-col justify-between overflow-hidden">
  
  <div class="text-center space-y-1 border-b-2 border-[#C5A059]/40 pb-4">
    <h1 class="text-3xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
    <p class="text-xs text-[#C5A059] font-bold uppercase tracking-widest">Order Status Display</p>
  </div>

  <div class="grid grid-cols-2 gap-8 flex-1 my-6 overflow-hidden">
    <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-6 flex flex-col">
      <h2 class="text-xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-3 text-center uppercase tracking-wider">Preparing</h2>
      <div id="tvPreparingList" class="grid grid-cols-2 gap-4 mt-6 text-center overflow-y-auto"></div>
    </div>

    <div class="bg-[#FAF6F0] border-2 border-[#58111A] p-6 flex flex-col">
      <h2 class="text-xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-3 text-center uppercase tracking-wider">Ready For Pickup</h2>
      <div id="tvReadyList" class="grid grid-cols-2 gap-4 mt-6 text-center overflow-y-auto"></div>
    </div>
  </div>

  <script>
    var lastTvHash = "";

    try {
      var liveChannel = new BroadcastChannel('moncher_order_stream');
      liveChannel.onmessage = function(event) {
        if (event.data === 'NEW_ORDER_SYNC' || event.data === 'STATUS_CHANGE') {
          syncTvData();
        }
      };
    } catch(e){}

    function syncTvData() {
      google.script.run
        .withSuccessHandler(function(data) {
          var prep = (data && data.preparing) ? data.preparing : [];
          var ready = (data && data.ready) ? data.ready : [];
          var currentHash = JSON.stringify(prep) + JSON.stringify(ready);

          if (currentHash === lastTvHash) return;
          lastTvHash = currentHash;

          var prepContainer = document.getElementById('tvPreparingList');
          var readyContainer = document.getElementById('tvReadyList');

          prepContainer.innerHTML = (prep.length > 0)
            ? prep.map(function(o) {
                return '<div class="bg-[#FDFBF7] border border-[#C5A059]/30 p-4 font-bold text-2xl text-[#1A1A1A]">#' + o.table + ' <span class="text-xs block text-gray-500 font-bold">' + o.id + '</span></div>';
              }).join('')
            : '<p class="text-xs text-gray-400 col-span-2 py-8 font-bold">No tickets preparing</p>';

          readyContainer.innerHTML = (ready.length > 0)
            ? ready.map(function(o) {
                return '<div class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] p-4 font-bold text-2xl animate-pulse">#' + o.table + ' <span class="text-xs block text-[#C5A059] font-bold">' + o.id + '</span></div>';
              }).join('')
            : '<p class="text-xs text-gray-400 col-span-2 py-8 font-bold">No orders ready</p>';
        })
        .getActiveKitchenOrders();
    }

    syncTvData();
    setInterval(syncTvData, 2000);
  </script>
</body>
</html>
