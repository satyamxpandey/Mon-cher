<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Display Screen - Moncher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FDFBF7] h-screen p-8 flex flex-col justify-between font-sans">
  <div class="text-center space-y-2 border-b-2 border-[#C5A059]/40 pb-4">
    <h1 class="font-serif text-4xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
    <p class="text-xs text-[#C5A059] font-semibold uppercase tracking-widest">Order Status Display</p>
  </div>

  <div class="grid grid-cols-2 gap-8 flex-1 my-6">
    <!-- Preparing Column -->
    <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-6">
      <h2 class="font-serif text-2xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-3 text-center uppercase">Preparing</h2>
      <div class="grid grid-cols-2 gap-4 mt-6 text-center">
        <div class="bg-[#FDFBF7] border border-[#C5A059]/30 p-4 font-bold text-xl text-[#1A1A1A]">#104</div>
        <div class="bg-[#FDFBF7] border border-[#C5A059]/30 p-4 font-bold text-xl text-[#1A1A1A]">#105</div>
      </div>
    </div>

    <!-- Ready for Pickup Column -->
    <div class="bg-[#FAF6F0] border-2 border-[#58111A] p-6">
      <h2 class="font-serif text-2xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-3 text-center uppercase">Ready for Pickup</h2>
      <div class="grid grid-cols-2 gap-4 mt-6 text-center">
        <div class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] p-4 font-bold text-xl animate-pulse">#102</div>
        <div class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] p-4 font-bold text-xl animate-pulse">#103</div>
      </div>
    </div>
  </div>
</body>
</html>
