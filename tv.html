<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Status Display - MONCHER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lato', sans-serif; background: #FDFBF7; }
  </style>
</head>
<body class="h-screen p-8 flex flex-col justify-between overflow-hidden">
  
  <div class="text-center space-y-1 border-b-2 border-[#C5A059]/40 pb-4">
    <h1 class="text-3xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
    <p class="text-xs text-[#C5A059] font-bold uppercase tracking-widest">Order Status Display</p>
  </div>

  <div class="grid grid-cols-2 gap-8 flex-1 my-6 overflow-hidden">
    <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-6 flex flex-col">
      <h2 class="text-xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-3 text-center uppercase tracking-wider">Preparing</h2>
      <div id="tvPreparingList" class="grid grid-cols-2 gap-4 mt-6 text-center overflow-y-auto"></div>
    </div>

    <div class="bg-[#FAF6F0] border-2 border-[#58111A] p-6 flex flex-col">
      <h2 class="text-xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-3 text-center uppercase tracking-wider">Ready For Pickup</h2>
      <div id="tvReadyList" class="grid grid-cols-2 gap-4 mt-6 text-center overflow-y-auto"></div>
    </div>
  </div>

  <script>
    function syncTvData() {
      google.script.run
        .withSuccessHandler(function(data) {
          const prepContainer = document.getElementById('tvPreparingList');
          const readyContainer = document.getElementById('tvReadyList');

          prepContainer.innerHTML = (data.preparing.length > 0)
            ? data.preparing.map(o => `<div class="bg-[#FDFBF7] border border-[#C5A059]/30 p-4 font-bold text-2xl text-[#1A1A1A]">#${o.table} <span class="text-xs block text-gray-500">${o.id}</span></div>`).join('')
            : `<p class="text-xs text-gray-400 col-span-2 py-8">No tickets preparing</p>`;

          readyContainer.innerHTML = (data.ready.length > 0)
            ? data.ready.map(o => `<div class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] p-4 font-bold text-2xl animate-pulse">#${o.table} <span class="text-xs block text-[#C5A059]">${o.id}</span></div>`).join('')
            : `<p class="text-xs text-gray-400 col-span-2 py-8">No orders ready</p>`;
        })
        .getActiveKitchenOrders();
    }

    syncTvData();
    setInterval(syncTvData, 4000);
  </script>
</body>
</html>
