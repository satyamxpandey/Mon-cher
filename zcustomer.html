<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu & Pay - Moncher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #FDFBF7; color: #1A1A1A; }
    .font-serif-classic { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="pb-28">

  <!-- Mobile Luxury Header -->
  <header class="sticky top-0 bg-[#FDFBF7]/95 backdrop-blur border-b-2 border-[#C5A059]/40 px-6 py-4 text-center z-40">
    <h1 class="font-serif-classic text-2xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
    <div class="w-12 h-0.5 bg-[#C5A059] mx-auto my-1"></div>
    <p class="text-[9px] text-[#C5A059] uppercase tracking-widest font-bold">Fine Dining Mobile Ordering</p>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Table Number Selection Box -->
    <div class="bg-[#FAF6F0] border-2 border-[#C5A059] p-4 shadow-sm space-y-2">
      <label class="block text-xs font-bold text-[#58111A] uppercase tracking-wider">
        📍 Enter Your Table Number:
      </label>
      <input type="number" id="tableNo" placeholder="e.g. 05" class="w-full bg-[#FDFBF7] border border-[#C5A059]/60 px-4 py-2 text-sm font-bold text-[#58111A] focus:outline-none focus:border-[#58111A]">
    </div>

    <!-- Category Header -->
    <div class="space-y-4">
      <h2 class="font-serif-classic text-xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-2">Our Digital Menu</h2>

      <!-- Menu Items List -->
      <div id="customerMenuList" class="space-y-3"></div>
    </div>
  </main>

  <!-- Bottom Floating View Cart Button -->
  <div id="bottomBar" class="fixed bottom-0 left-0 right-0 p-4 bg-[#FDFBF7]/90 backdrop-blur border-t-2 border-[#C5A059]/40 hidden z-30">
    <div class="max-w-md mx-auto flex justify-between items-center bg-[#58111A] text-[#FDFBF7] p-3.5 border border-[#C5A059] shadow-xl">
      <div>
        <p id="totalItemsCount" class="text-[10px] text-[#C5A059] uppercase font-bold">0 Items Selected</p>
        <p id="cartTotalSum" class="font-serif-classic font-bold text-base">₹0.00</p>
      </div>
      <button onclick="openCheckoutModal()" class="bg-[#C5A059] text-[#58111A] px-4 py-2 text-xs font-bold uppercase tracking-wider hover:bg-[#d4b06a]">
        Pay Online Now →
      </button>
    </div>
  </div>

  <!-- Online Payment & Order Checkout Modal -->
  <div id="paymentModal" class="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center hidden p-4">
    <div class="bg-[#FDFBF7] border-2 border-[#C5A059] w-full max-w-md p-6 space-y-4 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeCheckoutModal()" class="absolute top-3 right-3 text-lg font-bold text-[#58111A]">✕</button>

      <div class="text-center border-b border-[#C5A059]/30 pb-3">
        <h3 class="font-serif-classic text-lg font-bold text-[#58111A]">Complete Payment</h3>
        <p id="modalTableInfo" class="text-xs text-[#C5A059] font-semibold uppercase mt-0.5">Table # --</p>
      </div>

      <!-- Itemized Order Summary -->
      <div id="modalOrderItems" class="space-y-2 text-xs border-b border-[#C5A059]/20 pb-3"></div>

      <!-- Payment Method Selection -->
      <div class="space-y-2">
        <p class="text-xs font-bold text-[#58111A] uppercase">Select Online Payment Method:</p>
        
        <div class="space-y-2">
          <label class="flex items-center gap-3 p-3 border border-[#C5A059]/40 bg-[#FAF6F0] cursor-pointer">
            <input type="radio" name="payMethod" value="upi" checked class="accent-[#58111A]">
            <span class="text-xs font-bold">UPI (Google Pay / PhonePe / Paytm)</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-[#C5A059]/40 bg-[#FAF6F0] cursor-pointer">
            <input type="radio" name="payMethod" value="card" class="accent-[#58111A]">
            <span class="text-xs font-bold">Credit / Debit Card</span>
          </label>
        </div>
      </div>

      <button onclick="processOnlinePayment()" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-3 text-xs font-bold uppercase tracking-widest hover:bg-[#3D0B12]">
        Pay & Send Order To Kitchen
      </button>
    </div>
  </div>

  <script>
    const customerMenu = [
      { id: "M01", name: "Stuff Kurkure Chaap", price: 500, desc: "Crispy fried soy chaap filled with rich cottage cheese" },
      { id: "M02", name: "Stuff Tandoori Mushroom", price: 500, desc: "Clay oven roasted mushrooms stuffed with herbs" },
      { id: "M03", name: "Cheese Mushroom Duplex", price: 500, desc: "Double mushroom caps stuffed with melted cheese" },
      { id: "M04", name: "Bhatti Chicken Barra", price: 550, desc: "Slow roasted smoky bhatti chicken morsels" },
      { id: "M05", name: "Dal Makhani", price: 450, desc: "Overnight cooked black lentils with white butter" },
      { id: "M06", name: "Paneer Lababdar", price: 450, desc: "Cottage cheese cubes in rich tomato cashew gravy" }
    ];

    let userCart = [];

    window.onload = function() {
      const container = document.getElementById('customerMenuList');
      container.innerHTML = customerMenu.map(item => `
        <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-3.5 flex justify-between items-center shadow-sm">
          <div class="flex-1 pr-3">
            <h3 class="font-serif-classic font-bold text-sm text-[#58111A]">${item.name}</h3>
            <p class="text-[10px] text-[#1A1A1A]/70 mt-0.5">${item.desc}</p>
            <p class="font-bold text-xs text-[#1A1A1A] mt-1">₹${item.price.toFixed(2)}</p>
          </div>
          
          <div id="btn-container-${item.id}">
            <button onclick="addItem('${item.id}')" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1.5 text-xs font-bold uppercase">
              + Add
            </button>
          </div>
        </div>
      `).join('');
    };

    function addItem(id) {
      const item = customerMenu.find(i => i.id === id);
      const exist = userCart.find(c => c.id === id);
      if(exist) exist.qty++; else userCart.push({...item, qty: 1});
      updateUI();
    }

    function changeQty(id, delta) {
      const item = userCart.find(c => c.id === id);
      if(!item) return;
      item.qty += delta;
      if(item.qty <= 0) userCart = userCart.filter(c => c.id !== id);
      updateUI();
    }

    function updateUI() {
      // Refresh individual item control buttons
      customerMenu.forEach(item => {
        const cartItem = userCart.find(c => c.id === item.id);
        const container = document.getElementById(`btn-container-${item.id}`);
        
        if(cartItem) {
          container.innerHTML = `
            <div class="flex items-center border border-[#C5A059] bg-[#FDFBF7]">
              <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 font-bold text-[#58111A]">-</button>
              <span class="w-6 text-center font-bold text-xs">${cartItem.qty}</span>
              <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 font-bold text-[#58111A]">+</button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <button onclick="addItem('${item.id}')" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1.5 text-xs font-bold uppercase">
              + Add
            </button>
          `;
        }
      });

      // Bottom Bar Update
      const totalQty = userCart.reduce((s, c) => s + c.qty, 0);
      const totalSum = userCart.reduce((s, c) => s + (c.price * c.qty), 0);
      
      const bottomBar = document.getElementById('bottomBar');
      if(totalQty > 0) {
        bottomBar.classList.remove('hidden');
        document.getElementById('totalItemsCount').innerText = `${totalQty} ITEMS ADDED`;
        document.getElementById('cartTotalSum').innerText = `₹${totalSum.toFixed(2)}`;
      } else {
        bottomBar.classList.add('hidden');
      }
    }

    function openCheckoutModal() {
      const tbl = document.getElementById('tableNo').value;
      if(!tbl) {
        alert('Please enter your Table Number first!');
        document.getElementById('tableNo').focus();
        return;
      }

      document.getElementById('modalTableInfo').innerText = `ORDER FOR TABLE #${tbl}`;
      
      const itemsContainer = document.getElementById('modalOrderItems');
      itemsContainer.innerHTML = userCart.map(c => `
        <div class="flex justify-between border-b border-[#C5A059]/20 pb-1">
          <span>${c.name} x ${c.qty}</span>
          <span class="font-bold text-[#58111A]">₹${(c.price * c.qty).toFixed(2)}</span>
        </div>
      `).join('');

      const totalSum = userCart.reduce((s, c) => s + (c.price * c.qty), 0);
      itemsContainer.innerHTML += `
        <div class="flex justify-between font-bold text-sm text-[#58111A] pt-2">
          <span>Total</span>
          <span>₹${totalSum.toFixed(2)}</span>
        </div>
      `;

      document.getElementById('paymentModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('paymentModal').classList.add('hidden');
    }

    function processOnlinePayment() {
      const tbl = document.getElementById('tableNo').value;
      alert(`Payment Successful!\nOrder sent to Kitchen for Table #${tbl}.`);
      userCart = [];
      document.getElementById('tableNo').value = '';
      closeCheckoutModal();
      updateUI();
    }
  </script>
</body>
</html>
