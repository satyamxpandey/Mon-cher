<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu - Moncher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FDFBF7] text-[#1A1A1A] font-sans pb-12">
  <header class="text-center py-10 border-b-2 border-[#C5A059]/40 bg-[#FAF6F0]">
    <h1 class="font-serif text-4xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
    <div class="w-16 h-0.5 bg-[#C5A059] mx-auto my-2"></div>
    <p class="text-xs text-[#C5A059] uppercase tracking-widest font-semibold">Fine Dining & Lounge</p>
  </header>

  <main class="max-w-3xl mx-auto p-6 space-y-10">
    <!-- Category -->
    <section class="space-y-4">
      <h2 class="font-serif text-2xl font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-2">Chef Specials</h2>
      <div class="space-y-4">
        <div class="flex justify-between items-baseline border-b border-dotted border-[#C5A059]/40 pb-2">
          <div>
            <h3 class="font-serif font-bold text-base text-[#1A1A1A]">Stuff Kurkure Chaap</h3>
            <p class="text-xs text-[#1A1A1A]/60">House-special spiced soy chaap with crisp coating</p>
          </div>
          <span class="font-bold text-[#58111A] text-sm">₹500.00</span>
        </div>
        <div class="flex justify-between items-baseline border-b border-dotted border-[#C5A059]/40 pb-2">
          <div>
            <h3 class="font-serif font-bold text-base text-[#1A1A1A]">Bhatti Chicken Barra</h3>
            <p class="text-xs text-[#1A1A1A]/60">Slow-roasted smoky bhatti chicken morsels</p>
          </div>
          <span class="font-bold text-[#58111A] text-sm">₹550.00</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
