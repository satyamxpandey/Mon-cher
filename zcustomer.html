<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moncher - Digital Table Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lato', sans-serif; background: #FDFBF7; color: #1A1A1A; }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #FAF6F0; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">

  <!-- Table Lock Modal -->
  <div id="tableModal" class="fixed inset-0 bg-[#58111A]/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#FDFBF7] border-2 border-[#C5A059] w-full max-w-xs p-6 shadow-2xl rounded-sm text-center">
      <h2 class="text-xl font-bold text-[#58111A] tracking-widest uppercase mb-1">Welcome</h2>
      <p class="text-[10px] text-[#C5A059] font-bold uppercase tracking-wider mb-4">Moncher Fine Dining</p>
      
      <div class="mb-4">
        <label class="block text-xs font-bold text-[#58111A] uppercase mb-1">Enter Your Table No.</label>
        <input type="number" id="custTableInput" placeholder="e.g. 05" class="w-full bg-[#FAF6F0] border border-[#C5A059] text-center py-2 text-lg font-bold text-[#58111A] outline-none">
      </div>

      <button onclick="confirmTableNumber()" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-2 text-xs font-bold uppercase tracking-wider hover:bg-[#3D0B12]">
        Start Ordering
      </button>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-[#FDFBF7] border-b-2 border-[#C5A059]/40 px-4 py-3 flex justify-between items-center shrink-0 shadow-sm">
    <div>
      <h1 class="text-lg font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
      <p class="text-[8px] text-[#C5A059] uppercase tracking-widest font-bold">Self-Order Menu</p>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[10px] text-gray-500 font-bold uppercase">Table:</span>
      <span id="displayTableNum" class="text-xs font-bold text-[#58111A] bg-[#FAF6F0] px-2 py-0.5 border border-[#C5A059]/40 rounded-sm">--</span>
    </div>
  </header>

  <!-- Category Pills Navigation -->
  <div class="bg-[#FAF6F0] border-b border-[#C5A059]/30 px-3 py-2 flex gap-2 overflow-x-auto shrink-0" id="categoryTabs">
    <button onclick="filterCategory('ALL')" class="cat-btn bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1 text-[11px] font-bold uppercase whitespace-nowrap">All</button>
  </div>

  <!-- Menu Item Feed -->
  <main id="customerMenuList" class="flex-1 overflow-y-auto p-3 space-y-3">
    <p class="text-xs text-center text-gray-400 py-12">Loading menu...</p>
  </main>

  <!-- Floating Sticky Cart Bar -->
  <div id="bottomCartBar" class="bg-[#FAF6F0] border-t-2 border-[#C5A059] p-3 shrink-0 flex items-center justify-between shadow-lg">
    <div>
      <p class="text-[10px] text-gray-500 font-bold uppercase"><span id="cartCount">0</span> Items in Cart</p>
      <p id="cartTotal" class="text-sm font-bold text-[#58111A]">₹0.00</p>
    </div>
    <button onclick="openCartDrawer()" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-5 py-2 text-xs font-bold uppercase tracking-wider hover:bg-[#3D0B12] shadow-sm">
      View Cart / Order
    </button>
  </div>

  <!-- Cart / Checkout Drawer -->
  <div id="cartDrawer" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 hidden flex flex-col justify-end">
    <div class="bg-[#FDFBF7] border-t-2 border-[#C5A059] p-4 max-h-[80vh] flex flex-col shadow-2xl rounded-t-lg">
      <div class="flex justify-between items-center border-b border-[#C5A059]/30 pb-2 mb-3">
        <h2 class="text-sm font-bold text-[#58111A] uppercase">Your Order Summary</h2>
        <button onclick="closeCartDrawer()" class="text-xs font-bold text-gray-500 hover:text-[#58111A]">✕ Close</button>
      </div>

      <div id="drawerCartList" class="flex-1 overflow-y-auto space-y-2 py-1 max-h-56"></div>

      <div class="border-t border-[#C5A059]/30 pt-3 mt-3 space-y-2">
        <div class="flex justify-between items-center text-xs font-bold text-[#58111A]">
          <span>Total Bill</span>
          <span id="drawerTotalSum" class="text-base">₹0.00</span>
        </div>

        <button onclick="placeCustomerOrder()" id="btnPlaceOrder" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-2.5 text-xs font-bold uppercase tracking-wider hover:bg-[#3D0B12] shadow-md">
          Confirm & Send To Kitchen
        </button>
      </div>
    </div>
  </div>

  <!-- Order Success Screen -->
  <div id="successModal" class="fixed inset-0 bg-[#58111A] z-50 hidden flex flex-col items-center justify-center p-6 text-center text-[#FDFBF7]">
    <div class="w-12 h-12 rounded-full border-2 border-[#C5A059] flex items-center justify-center text-xl font-bold mb-3">✓</div>
    <h2 class="text-xl font-bold tracking-wider uppercase mb-1">Order Received!</h2>
    <p class="text-xs text-[#C5A059] font-bold uppercase mb-4" id="successOrderId">Order #ORD-XXXX</p>
    <p class="text-xs text-gray-200 max-w-xs mb-6">Your order has been sent directly to the kitchen. You can track your table number on the status screen.</p>
    <button onclick="resetCustomerSession()" class="bg-[#FDFBF7] text-[#58111A] border border-[#C5A059] px-6 py-2 text-xs font-bold uppercase tracking-wider">
      Order More Items
    </button>
  </div>

  <script>
    let menuData = [];
    let custCart = [];
    let activeCategory = "ALL";
    let customerTable = null;

    window.onload = function() {
      detectTableFromUrl();
      loadMenuData();
    };

    function detectTableFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const tbl = params.get('table');
      if (tbl) {
        setTableNumber(tbl);
      }
    }

    function confirmTableNumber() {
      const val = document.getElementById('custTableInput').value.trim();
      if (!val) { alert('Please enter your table number.'); return; }
      setTableNumber(val);
    }

    function setTableNumber(tbl) {
      customerTable = tbl;
      document.getElementById('displayTableNum').innerText = `#${tbl}`;
      document.getElementById('tableModal').classList.add('hidden');
    }

    function loadMenuData() {
      google.script.run
        .withSuccessHandler(function(res) {
          menuData = res.menu;
          renderCategoryPills();
          renderCustomerMenu();
        })
        .withFailureHandler(function(err) {
          alert('Failed to load menu: ' + err.message);
        })
        .getInitialData();
    }

    function renderCategoryPills() {
      const cats = ["ALL", ...new Set(menuData.map(i => i.category))];
      const container = document.getElementById('categoryTabs');
      container.innerHTML = cats.map(c => `
        <button onclick="filterCategory('${c}')" id="cat-btn-${c}" class="cat-btn ${c === activeCategory ? 'bg-[#58111A] text-[#FDFBF7]' : 'bg-[#FDFBF7] text-[#58111A]'} border border-[#C5A059]/40 px-3 py-1 text-[11px] font-bold uppercase whitespace-nowrap">${c}</button>
      `).join('');
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = "cat-btn bg-[#FDFBF7] text-[#58111A] border border-[#C5A059]/40 px-3 py-1 text-[11px] font-bold uppercase whitespace-nowrap";
      });
      const activeBtn = document.getElementById(`cat-btn-${cat}`);
      if(activeBtn) activeBtn.className = "cat-btn bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1 text-[11px] font-bold uppercase whitespace-nowrap shadow-sm";
      renderCustomerMenu();
    }

    function renderCustomerMenu() {
      const container = document.getElementById('customerMenuList');
      const filtered = menuData.filter(i => activeCategory === "ALL" || i.category === activeCategory);

      container.innerHTML = filtered.map(item => {
        const cartItem = custCart.find(c => c.id === item.id);
        const qty = cartItem ? cartItem.qty : 0;
        return `
          <div class="bg-[#FAF6F0] border border-[#C5A059]/40 p-3 flex justify-between items-center rounded-sm shadow-xs">
            <div class="flex-1 pr-3">
              <div class="flex items-center gap-1.5">
                <span class="inline-block w-2 h-2 rounded-full ${item.veg ? 'bg-green-600' : 'bg-red-600'}"></span>
                <h3 class="font-bold text-xs text-[#58111A]">${item.name}</h3>
              </div>
              <p class="text-[9px] text-[#C5A059] uppercase font-bold mt-0.5">${item.category}</p>
              <p class="text-xs font-bold text-[#1A1A1A] mt-1">₹${item.price.toFixed(2)}</p>
            </div>

            <div>
              ${qty > 0 ? `
                <div class="flex items-center border border-[#C5A059] bg-[#FDFBF7]">
                  <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 font-bold text-[#58111A]">-</button>
                  <span class="w-6 text-center font-bold text-xs">${qty}</span>
                  <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 font-bold text-[#58111A]">+</button>
                </div>
              ` : `
                <button onclick="updateQty('${item.id}', 1)" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1 text-[11px] font-bold uppercase">
                  + Add
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      const exist = custCart.find(c => c.id === id);

      if (exist) {
        exist.qty += delta;
        if (exist.qty <= 0) {
          custCart = custCart.filter(c => c.id !== id);
        }
      } else if (delta > 0) {
        custCart.push({ ...item, qty: 1 });
      }

      renderCustomerMenu();
      syncCartTotals();
    }

    function syncCartTotals() {
      const totalItems = custCart.reduce((sum, i) => sum + i.qty, 0);
      const totalCost = custCart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      document.getElementById('cartCount').innerText = totalItems;
      document.getElementById('cartTotal').innerText = `₹${totalCost.toFixed(2)}`;
      document.getElementById('drawerTotalSum').innerText = `₹${totalCost.toFixed(2)}`;

      renderDrawerList();
    }

    function openCartDrawer() {
      if (custCart.length === 0) { alert('Your cart is empty.'); return; }
      document.getElementById('cartDrawer').classList.remove('hidden');
    }

    function closeCartDrawer() {
      document.getElementById('cartDrawer').classList.add('hidden');
    }

    function renderDrawerList() {
      const container = document.getElementById('drawerCartList');
      if (custCart.length === 0) {
        container.innerHTML = `<p class="text-xs text-center text-gray-400 py-6">No items selected</p>`;
        return;
      }

      container.innerHTML = custCart.map(i => `
        <div class="flex justify-between items-center text-xs py-1 border-b border-gray-100">
          <div>
            <p class="font-bold text-[#58111A]">${i.name}</p>
            <p class="text-[10px] text-gray-500">₹${i.price} × ${i.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex items-center border border-[#C5A059]">
              <button onclick="updateQty('${i.id}', -1)" class="w-5 h-5 text-center font-bold">-</button>
              <span class="w-5 text-center font-bold text-[11px]">${i.qty}</span>
              <button onclick="updateQty('${i.id}', 1)" class="w-5 h-5 text-center font-bold">+</button>
            </div>
            <span class="font-bold text-[#58111A] min-w-[50px] text-right">₹${(i.price * i.qty).toFixed(2)}</span>
          </div>
        </div>
      `).join('');
    }

    function placeCustomerOrder() {
      if (!customerTable) {
        alert('Table number missing. Please set your table.');
        document.getElementById('tableModal').classList.remove('hidden');
        return;
      }

      const totalCost = custCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const btn = document.getElementById('btnPlaceOrder');
      btn.innerText = "Transmitting Order...";
      btn.disabled = true;

      const orderData = {
        table: customerTable,
        items: custCart,
        total: totalCost,
        paymentMode: "Self-Order (Pending)"
      };

      google.script.run
        .withSuccessHandler(function(res) {
          btn.innerText = "Confirm & Send To Kitchen";
          btn.disabled = false;
          closeCartDrawer();
          document.getElementById('successOrderId').innerText = `Ticket #${res.orderId}`;
          document.getElementById('successModal').classList.remove('hidden');
        })
        .withFailureHandler(function(err) {
          alert('Error submitting order: ' + err.message);
          btn.innerText = "Confirm & Send To Kitchen";
          btn.disabled = false;
        })
        .submitNewOrder(orderData);
    }

    function resetCustomerSession() {
      custCart = [];
      syncCartTotals();
      renderCustomerMenu();
      document.getElementById('successModal').classList.add('hidden');
    }
  </script>
</body>
</html>
