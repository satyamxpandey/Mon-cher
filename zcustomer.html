<script>
    var API_URL = "https://script.google.com/macros/s/AKfycbxkwNfmiY6-zlj2cVmet56-o2S4O-n9skVIuBGVN-wZxXAl2NQwlI_7Cbu4Nej45Ig8/exec";
    var menuData = [];
    var custCart = [];
    var activeCategory = "ALL";
    var customerTable = null;

    // 1. Define JSONP Callbacks
    window.handleCustomerData = function(res) {
      var container = document.getElementById("customerMenuList");
      if (!res || !res.menu || res.menu.length === 0) {
        if (container) {
          container.innerHTML = "<p class='text-xs text-red-600 text-center py-10 font-bold'>Menu is currently unavailable in database.</p>";
        }
        return;
      }
      menuData = res.menu;
      renderCategoryPills();
      renderCustomerMenu();
    };

    window.handleMoncherData = window.handleCustomerData;

    // 2. Load API via Dynamic Script Injection
    function fetchMenuFromAPI() {
      var oldScript = document.getElementById("cust-jsonp-script");
      if (oldScript) oldScript.remove();

      var script = document.createElement("script");
      script.id = "cust-jsonp-script";
      script.src = API_URL + "?action=getInitialData&callback=handleCustomerData&_t=" + Date.now();
      script.onerror = function() {
        var container = document.getElementById("customerMenuList");
        if (container) {
          container.innerHTML = "<div class='p-4 text-center bg-red-50 border border-red-200 text-red-700 text-xs font-bold'>Failed to connect to menu API. Please ensure Apps Script deployment is set to 'Anyone'.</div>";
        }
      };
      document.head.appendChild(script);
    }

    function detectTableFromUrl() {
      var params = new URLSearchParams(window.location.search);
      var tbl = params.get("table");
      if (tbl) {
        setTableNumber(tbl);
      }
    }

    function confirmTableNumber() {
      var val = document.getElementById("custTableInput").value.trim();
      if (!val) { alert("Please enter your table number."); return; }
      setTableNumber(val);
    }

    function setTableNumber(tbl) {
      customerTable = tbl;
      document.getElementById("displayTableNum").innerText = "#" + tbl;
      document.getElementById("tableModal").classList.add("hidden");
    }

    function renderCategoryPills() {
      var cats = ["ALL"];
      for (var i = 0; i < menuData.length; i++) {
        if (menuData[i].category && cats.indexOf(menuData[i].category) === -1) {
          cats.push(menuData[i].category);
        }
      }

      var container = document.getElementById("categoryTabs");
      if (!container) return;

      container.innerHTML = cats.map(function(c) {
        var activeClass = (c === activeCategory) ? "bg-[#58111A] text-[#FDFBF7]" : "bg-[#FDFBF7] text-[#58111A]";
        return "<button onclick=\"filterCategory('" + c + "')\" id=\"cat-btn-" + c.replace(/[^a-zA-Z0-9]/g, "_") + "\" class=\"cat-btn " + activeClass + " border border-[#C5A059]/40 px-3 py-1 text-[11px] font-bold uppercase whitespace-nowrap cursor-pointer\">" + c + "</button>";
      }).join("");
    }

    function filterCategory(cat) {
      activeCategory = cat;
      var buttons = document.querySelectorAll(".cat-btn");
      buttons.forEach(function(b) {
        b.className = "cat-btn bg-[#FDFBF7] text-[#58111A] border border-[#C5A059]/40 px-3 py-1 text-[11px] font-bold uppercase whitespace-nowrap cursor-pointer";
      });
      var activeBtn = document.getElementById("cat-btn-" + cat.replace(/[^a-zA-Z0-9]/g, "_"));
      if (activeBtn) activeBtn.className = "cat-btn bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1 text-[11px] font-bold uppercase whitespace-nowrap shadow-sm cursor-pointer";
      renderCustomerMenu();
    }

    function renderCustomerMenu() {
      var container = document.getElementById("customerMenuList");
      if (!container) return;

      var filtered = menuData.filter(function(i) {
        return activeCategory === "ALL" || i.category === activeCategory;
      });

      if (filtered.length === 0) {
        container.innerHTML = "<p class='text-xs text-center text-gray-400 py-10 font-bold'>No items in this category.</p>";
        return;
      }

      container.innerHTML = filtered.map(function(item) {
        var cartItem = custCart.find(function(c) { return c.id === item.id; });
        var qty = cartItem ? cartItem.qty : 0;
        var dotColor = item.veg ? "bg-green-600" : "bg-red-600";

        var actionMarkup = (qty > 0)
          ? "<div class=\"flex items-center border border-[#C5A059] bg-[#FDFBF7]\">" +
              "<button onclick=\"updateQty('" + item.id + "', -1)\" class=\"w-6 h-6 font-bold text-[#58111A] cursor-pointer\">-</button>" +
              "<span class=\"w-6 text-center font-bold text-xs\">" + qty + "</span>" +
              "<button onclick=\"updateQty('" + item.id + "', 1)\" class=\"w-6 h-6 font-bold text-[#58111A] cursor-pointer\">+</button>" +
            "</div>"
          : "<button onclick=\"updateQty('" + item.id + "', 1)\" class=\"bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1 text-[11px] font-bold uppercase cursor-pointer\">" +
              "+ Add" +
            "</button>";

        return "<div class=\"bg-[#FAF6F0] border border-[#C5A059]/40 p-3 flex justify-between items-center rounded-sm shadow-xs\">" +
          "<div class=\"flex-1 pr-3\">" +
            "<div class=\"flex items-center gap-1.5\">" +
              "<span class=\"inline-block w-2 h-2 rounded-full " + dotColor + "\"></span>" +
              "<h3 class=\"font-bold text-xs text-[#58111A]\">" + item.name + "</h3>" +
            "</div>" +
            "<p class=\"text-[9px] text-[#C5A059] uppercase font-bold mt-0.5\">" + item.category + "</p>" +
            "<p class=\"text-xs font-bold text-[#1A1A1A] mt-1\">₹" + item.price.toFixed(2) + "</p>" +
          "</div>" +
          "<div>" + actionMarkup + "</div>" +
        "</div>";
      }).join("");
    }

    function updateQty(id, delta) {
      var item = menuData.find(function(i) { return i.id === id; });
      var exist = custCart.find(function(c) { return c.id === id; });

      if (exist) {
        exist.qty += delta;
        if (exist.qty <= 0) {
          custCart = custCart.filter(function(c) { return c.id !== id; });
        }
      } else if (delta > 0) {
        custCart.push({
          id: item.id,
          category: item.category,
          name: item.name,
          price: item.price,
          qty: 1
        });
      }

      renderCustomerMenu();
      syncCartTotals();
    }

    function syncCartTotals() {
      var totalItems = custCart.reduce(function(sum, i) { return sum + i.qty; }, 0);
      var totalCost = custCart.reduce(function(sum, i) { return sum + (i.price * i.qty); }, 0);

      document.getElementById("cartCount").innerText = totalItems;
      document.getElementById("cartTotal").innerText = "₹" + totalCost.toFixed(2);
      document.getElementById("drawerTotalSum").innerText = "₹" + totalCost.toFixed(2);

      renderDrawerList();
    }

    function openCartDrawer() {
      if (custCart.length === 0) { alert("Your cart is empty."); return; }
      document.getElementById("cartDrawer").classList.remove("hidden");
    }

    function closeCartDrawer() {
      document.getElementById("cartDrawer").classList.add("hidden");
    }

    function renderDrawerList() {
      var container = document.getElementById("drawerCartList");
      if (custCart.length === 0) {
        container.innerHTML = "<p class='text-xs text-center text-gray-400 py-6 font-bold'>No items selected</p>";
        return;
      }

      container.innerHTML = custCart.map(function(i) {
        return "<div class=\"flex justify-between items-center text-xs py-1 border-b border-gray-100\">" +
          "<div>" +
            "<p class=\"font-bold text-[#58111A]\">" + i.name + "</p>" +
            "<p class=\"text-[10px] text-gray-500\">₹" + i.price + " × " + i.qty + "</p>" +
          "</div>" +
          "<div class=\"flex items-center gap-2\">" +
            "<div class=\"flex items-center border border-[#C5A059]\">" +
              "<button onclick=\"updateQty('" + i.id + "', -1)\" class=\"w-5 h-5 text-center font-bold cursor-pointer\">-</button>" +
              "<span class=\"w-5 text-center font-bold text-[11px]\">" + i.qty + "</span>" +
              "<button onclick=\"updateQty('" + i.id + "', 1)\" class=\"w-5 h-5 text-center font-bold cursor-pointer\">+</button>" +
            "</div>" +
            "<span class=\"font-bold text-[#58111A] min-w-[50px] text-right\">₹" + (i.price * i.qty).toFixed(2) + "</span>" +
          "</div>" +
        "</div>";
      }).join("");
    }

    function placeCustomerOrder() {
      if (!customerTable) {
        alert("Table number missing. Please set your table.");
        document.getElementById("tableModal").classList.remove("hidden");
        return;
      }

      var totalCost = custCart.reduce(function(sum, i) { return sum + (i.price * i.qty); }, 0);
      var btn = document.getElementById("btnPlaceOrder");
      btn.innerText = "Transmitting Order...";
      btn.disabled = true;

      var orderData = {
        table: customerTable,
        items: custCart,
        total: totalCost,
        paymentMode: "Self-Order (Pending)"
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "submitOrder", data: orderData })
      })
      .then(function() {
        try {
          if (typeof BroadcastChannel !== "undefined") {
            var channel = new BroadcastChannel("moncher_order_stream");
            channel.postMessage("NEW_ORDER_SYNC");
          }
        } catch(e){}

        btn.innerText = "Confirm & Send To Kitchen";
        btn.disabled = false;
        closeCartDrawer();
        document.getElementById("successOrderId").innerText = "Table #" + customerTable;
        document.getElementById("successModal").classList.remove("hidden");
      })
      .catch(function(err) {
        alert("Error submitting order: " + err.message);
        btn.innerText = "Confirm & Send To Kitchen";
        btn.disabled = false;
      });
    }

    function resetCustomerSession() {
      custCart = [];
      syncCartTotals();
      renderCustomerMenu();
      document.getElementById("successModal").classList.add("hidden");
    }

    window.addEventListener("DOMContentLoaded", function() {
      detectTableFromUrl();
      fetchMenuFromAPI();
    });
  </script>
