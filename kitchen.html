<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONCHER - Kitchen KDS • Ofbuzz Technology</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lato', sans-serif; background-color: #FAF6F0; color: #1A1A1A; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background-color: #C5A059; border-radius: 4px; }
    ::-webkit-scrollbar-track { background-color: #FAF6F0; }
  </style>
</head>
<body class="h-screen flex flex-col p-6 overflow-hidden">
  
  <!-- Header Bar -->
  <header class="flex justify-between items-center border-b-2 border-[#C5A059] pb-3 mb-4 shrink-0">
    <div>
      <h1 class="text-2xl font-bold text-[#58111A] tracking-wider uppercase">Kitchen Display System (KDS)</h1>
      <p class="text-xs text-[#C5A059] font-bold uppercase">MONCHER • Powered by Ofbuzz Technology</p>
    </div>
    
    <div class="flex items-center gap-4">
      <!-- Section Switcher Tabs -->
      <div class="flex bg-[#FDFBF7] p-1 border border-[#C5A059]/40 rounded">
        <button onclick="switchKdsTab('prep')" id="tabBtnPrep" class="px-4 py-1 text-xs font-bold uppercase tracking-wider bg-[#58111A] text-[#FDFBF7] rounded cursor-pointer">
          Preparing (<span id="prepBadgeCount">0</span>)
        </button>
        <button onclick="switchKdsTab('ready')" id="tabBtnReady" class="px-4 py-1 text-xs font-bold uppercase tracking-wider text-[#58111A] hover:bg-[#FAF6F0] rounded cursor-pointer ml-1">
          Ready for Pickup (<span id="readyBadgeCount">0</span>)
        </button>
      </div>

      <div class="flex items-center gap-2 border-l border-[#C5A059]/40 pl-4">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-green-600 animate-pulse"></span>
        <span class="text-xs font-bold text-[#58111A]">Live Feed</span>
      </div>
    </div>
  </header>

  <!-- 1. PREPARING TICKETS VIEW -->
  <main id="secPrepOrders" class="grid grid-cols-1 md:grid-cols-3 gap-4 overflow-y-auto flex-1 align-content-start pr-1">
    <p class="text-sm text-gray-500 col-span-3 text-center py-12 font-bold">Connecting to Kitchen Stream...</p>
  </main>

  <!-- 2. READY FOR PICKUP VIEW (Customer Delivery Handover) -->
  <main id="secReadyOrders" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 overflow-y-auto flex-1 align-content-start pr-1">
    <p class="text-sm text-gray-500 col-span-3 text-center py-12 font-bold">No orders waiting for pickup.</p>
  </main>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbxkwNfmiY6-zlj2cVmet56-o2S4O-n9skVIuBGVN-wZxXAl2NQwlI_7Cbu4Nej45Ig8/exec";
    var activeTab = "prep";
    var cachedData = { preparing: [], ready: [] };
    var lastSyncHash = "";

    try {
      if (typeof BroadcastChannel !== "undefined") {
        var liveChannel = new BroadcastChannel("moncher_order_stream");
        liveChannel.onmessage = function(event) {
          if (event.data === "NEW_ORDER_SYNC" || event.data === "STATUS_CHANGE") {
            fetchKdsData();
          }
        };
      }
    } catch (e) {}

    function switchKdsTab(tab) {
      activeTab = tab;
      document.getElementById("secPrepOrders").classList.toggle("hidden", tab !== "prep");
      document.getElementById("secReadyOrders").classList.toggle("hidden", tab !== "ready");

      document.getElementById("tabBtnPrep").className = (tab === "prep")
        ? "px-4 py-1 text-xs font-bold uppercase tracking-wider bg-[#58111A] text-[#FDFBF7] rounded cursor-pointer"
        : "px-4 py-1 text-xs font-bold uppercase tracking-wider text-[#58111A] hover:bg-[#FAF6F0] rounded cursor-pointer";

      document.getElementById("tabBtnReady").className = (tab === "ready")
        ? "px-4 py-1 text-xs font-bold uppercase tracking-wider bg-green-700 text-[#FDFBF7] rounded cursor-pointer ml-1"
        : "px-4 py-1 text-xs font-bold uppercase tracking-wider text-[#58111A] hover:bg-[#FAF6F0] rounded cursor-pointer ml-1";
        
      renderAllTickets();
    }

    window.handleKdsStream = function(data) {
      cachedData = data || { preparing: [], ready: [] };
      var currentHash = JSON.stringify(cachedData);
      
      if (currentHash === lastSyncHash) return;
      lastSyncHash = currentHash;

      document.getElementById("prepBadgeCount").innerText = (cachedData.preparing || []).length;
      document.getElementById("readyBadgeCount").innerText = (cachedData.ready || []).length;

      renderAllTickets();
    };

    function renderAllTickets() {
      renderPreparingTickets(cachedData.preparing || []);
      renderReadyTickets(cachedData.ready || []);
    }

    function renderPreparingTickets(tickets) {
      var container = document.getElementById("secPrepOrders");
      if (!container) return;

      if (tickets.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-500 col-span-3 text-center py-12 font-bold">No active orders in preparation.</p>';
        return;
      }

      container.innerHTML = tickets.map(function(o) {
        var itemsList = (o.items || []).map(function(i) {
          return '<div class="flex justify-between py-1 border-b border-gray-100">' +
            '<span class="font-bold text-gray-800">' + i.name + '</span>' +
            '<span class="font-black text-[#58111A]">x' + i.qty + '</span>' +
          '</div>';
        }).join("");

        return '<div class="bg-[#FDFBF7] border-2 border-[#C5A059] p-4 shadow-md space-y-3 flex flex-col justify-between rounded-sm">' +
          '<div>' +
            '<div class="flex justify-between items-center border-b border-[#C5A059]/30 pb-2">' +
              '<div>' +
                '<h3 class="font-bold text-lg text-[#58111A]">Table #' + o.table + '</h3>' +
                '<p class="text-[10px] text-[#C5A059] font-bold uppercase tracking-wider">' + o.id + ' • ' + o.time + '</p>' +
              '</div>' +
              '<span class="bg-[#58111A] text-[#FDFBF7] text-[10px] px-2 py-0.5 uppercase font-bold tracking-wider rounded-xs">Preparing</span>' +
            '</div>' +
            '<div class="space-y-1 text-xs mt-3">' +
              itemsList +
            '</div>' +
          '</div>' +
          '<button onclick="updateStatus(\'' + o.id + '\', \'Ready\')" class="w-full bg-green-700 text-white py-2.5 text-xs font-bold uppercase tracking-wider hover:bg-green-800 transition-colors shadow-sm cursor-pointer">' +
            '✓ Mark Ready (Display on TV)' +
          '</button>' +
        '</div>';
      }).join("");
    }

    function renderReadyTickets(tickets) {
      var container = document.getElementById("secReadyOrders");
      if (!container) return;

      if (tickets.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-500 col-span-3 text-center py-12 font-bold">No orders waiting for pickup.</p>';
        return;
      }

      container.innerHTML = tickets.map(function(o) {
        var itemsList = (o.items || []).map(function(i) {
          return '<div class="flex justify-between py-1 border-b border-gray-100">' +
            '<span class="font-bold text-gray-800">' + i.name + '</span>' +
            '<span class="font-black text-green-800">x' + i.qty + '</span>' +
          '</div>';
        }).join("");

        return '<div class="bg-[#FAF6F0] border-2 border-green-600 p-4 shadow-md space-y-3 flex flex-col justify-between rounded-sm">' +
          '<div>' +
            '<div class="flex justify-between items-center border-b border-green-600/30 pb-2">' +
              '<div>' +
                '<h3 class="font-bold text-lg text-green-900">Table #' + o.table + '</h3>' +
                '<p class="text-[10px] text-green-700 font-bold uppercase tracking-wider">' + o.id + ' • ' + o.time + '</p>' +
              '</div>' +
              '<span class="bg-green-700 text-white text-[10px] px-2 py-0.5 uppercase font-bold tracking-wider rounded-xs">On TV Screen</span>' +
            '</div>' +
            '<div class="space-y-1 text-xs mt-3">' +
              itemsList +
            '</div>' +
          '</div>' +
          '<button onclick="updateStatus(\'' + o.id + '\', \'Completed\')" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-2.5 text-xs font-bold uppercase tracking-wider hover:bg-[#3D0B12] transition-colors shadow-sm cursor-pointer">' +
            '✓ Customer Collected (Remove from TV)' +
          '</button>' +
        '</div>';
      }).join("");
    }

    function fetchKdsData() {
      var oldScript = document.getElementById("kds-jsonp-script");
      if (oldScript) oldScript.remove();

      var script = document.createElement("script");
      script.id = "kds-jsonp-script";
      script.src = API_URL + "?action=getKitchenOrders&callback=handleKdsStream&_t=" + Date.now();
      document.head.appendChild(script);
    }

    function updateStatus(orderId, newStatus) {
      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "updateStatus", orderId: orderId, status: newStatus })
      }).then(function() {
        lastSyncHash = "";
        try {
          if (typeof BroadcastChannel !== "undefined") {
            var channel = new BroadcastChannel("moncher_order_stream");
            channel.postMessage("STATUS_CHANGE");
          }
        } catch (e) {}
        fetchKdsData();
      });
    }

    window.addEventListener("DOMContentLoaded", function() {
      fetchKdsData();
      setInterval(fetchKdsData, 3000);
    });
  </script>
</body>
</html>
