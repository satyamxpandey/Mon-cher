<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitchen Display System - Moncher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FDFBF7] p-6 text-[#1A1A1A] font-sans min-h-screen">
  <div class="border-b-2 border-[#C5A059]/40 pb-4 mb-6 flex justify-between items-center">
    <h1 class="font-serif text-2xl font-bold text-[#58111A] tracking-wider uppercase">KITCHEN DISPLAY SYSTEM (KDS)</h1>
    <span class="text-xs bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1 font-bold">LIVE QUEUE</span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Ticket Item -->
    <div class="bg-[#FAF6F0] border-2 border-[#58111A] p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-[#C5A059]/40 pb-2">
        <span class="font-bold text-sm text-[#58111A]">ORDER #104</span>
        <span class="text-[10px] text-amber-800 font-bold bg-amber-100 border border-amber-300 px-2 py-0.5">PREPARING</span>
      </div>
      <ul class="text-xs space-y-2 font-semibold">
        <li class="flex justify-between"><span>2x Stuff Kurkure Chaap</span> <span>Table 04</span></li>
        <li class="flex justify-between"><span>1x Dal Makhani</span> <span>Table 04</span></li>
      </ul>
      <button onclick="this.parentElement.remove()" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-2 text-xs uppercase font-bold tracking-widest hover:bg-[#3D0B12]">
        Mark Order Ready
      </button>
    </div>
  </div>
</body>
</html>
