<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing & POS - Moncher Luxury Lounge</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Playfair Display & Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FDFBF7;
      color: #1A1A1A;
    }
    .font-serif-classic {
      font-family: 'Playfair Display', serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #FAF6F0;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #C5A059;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-[#FDFBF7] text-[#1A1A1A]">

  <!-- Top Executive Header -->
  <header class="bg-[#FDFBF7] border-b-2 border-[#C5A059]/40 px-8 py-3.5 flex justify-between items-center shadow-sm shrink-0">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 border border-[#C5A059] bg-[#58111A] flex items-center justify-center text-[#FDFBF7] font-serif-classic font-bold text-xl shadow-md">
        M
      </div>
      <div>
        <h1 class="font-serif-classic text-xl font-bold text-[#58111A] tracking-wider uppercase">MONCHER</h1>
        <p class="text-[10px] tracking-widest text-[#C5A059] uppercase font-semibold">Fine Dining & POS System</p>
      </div>
    </div>

    <!-- Active Terminal Status -->
    <div class="flex items-center gap-4">
      <div class="text-right hidden sm:block">
        <p class="text-xs font-bold text-[#58111A]">TERMINAL #01</p>
        <p class="text-[10px] text-[#1A1A1A]/60">Operator: Admin</p>
      </div>
      <span class="w-3 h-3 rounded-full bg-emerald-600 border border-[#C5A059]" title="Server Online"></span>
    </div>
  </header>

  <!-- Main Work Area -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- LEFT PANEL: Category Filter, Search & Menu Grid -->
    <div class="flex-1 p-6 overflow-y-auto custom-scrollbar flex flex-col gap-5">
      
      <!-- Search Bar & Quick Action -->
      <div class="flex flex-col sm:flex-row gap-3 justify-between items-center border-b border-[#C5A059]/30 pb-4">
        <div class="relative w-full sm:w-80">
          <input 
            type="text" 
            id="searchInput" 
            oninput="handleSearch()" 
            placeholder="Search dish name or item ID..." 
            class="w-full bg-[#FAF6F0] border border-[#C5A059]/60 px-4 py-2 text-xs focus:outline-none focus:border-[#58111A] text-[#1A1A1A] placeholder-[#1A1A1A]/40 shadow-inner">
        </div>

        <!-- Category Buttons -->
        <div class="flex gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0" id="categoryBar">
          <button onclick="filterCategory('ALL')" class="cat-btn bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3.5 py-1.5 text-[11px] font-semibold tracking-wider uppercase whitespace-nowrap">All Items</button>
          <button onclick="filterCategory('Chef Special')" class="cat-btn border border-[#C5A059]/40 text-[#1A1A1A] hover:border-[#58111A] px-3.5 py-1.5 text-[11px] font-semibold tracking-wider uppercase whitespace-nowrap">Chef Special</button>
          <button onclick="filterCategory('Tandoori & Grills')" class="cat-btn border border-[#C5A059]/40 text-[#1A1A1A] hover:border-[#58111A] px-3.5 py-1.5 text-[11px] font-semibold tracking-wider uppercase whitespace-nowrap">Tandoori & Grills</button>
          <button onclick="filterCategory('Main Course')" class="cat-btn border border-[#C5A059]/40 text-[#1A1A1A] hover:border-[#58111A] px-3.5 py-1.5 text-[11px] font-semibold tracking-wider uppercase whitespace-nowrap">Main Course</button>
          <button onclick="filterCategory('Beverages')" class="cat-filter cat-btn border border-[#C5A059]/40 text-[#1A1A1A] hover:border-[#58111A] px-3.5 py-1.5 text-[11px] font-semibold tracking-wider uppercase whitespace-nowrap">Beverages</button>
        </div>
      </div>

      <!-- Menu Items Grid -->
      <div id="itemsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Javascript dynamically injects cards here -->
      </div>
    </div>

    <!-- RIGHT PANEL: Current Order & Billing Summary -->
    <div class="w-96 bg-[#FAF6F0] border-l-2 border-[#C5A059]/40 p-6 flex flex-col justify-between shadow-xl">
      
      <!-- Top Cart Header -->
      <div class="space-y-4 flex-1 flex flex-col overflow-hidden">
        <div class="flex justify-between items-center border-b border-[#C5A059]/40 pb-3">
          <div>
            <h2 class="font-serif-classic text-lg font-bold text-[#58111A]">Current Order</h2>
            <p class="text-[10px] text-[#C5A059] font-bold uppercase tracking-widest">Table / Counter #01</p>
          </div>
          <button onclick="clearCart()" class="text-[10px] text-rose-800 hover:text-rose-950 uppercase font-bold tracking-wider underline">Clear All</button>
        </div>

        <!-- Items Container in Cart -->
        <div id="cartContainer" class="space-y-3 overflow-y-auto flex-1 pr-1 custom-scrollbar">
          <!-- Dynamically Injected Cart Items -->
        </div>
      </div>

      <!-- Bottom Checkout Section -->
      <div class="border-t border-[#C5A059]/40 pt-4 space-y-3 shrink-0">
        <!-- Subtotal Details -->
        <div class="space-y-1.5 text-xs font-medium">
          <div class="flex justify-between text-[#1A1A1A]/70">
            <span>Subtotal</span>
            <span id="subtotalAmount">₹0.00</span>
          </div>
          <div class="flex justify-between text-[#1A1A1A]/70">
            <span>GST (5%)</span>
            <span id="taxAmount">₹0.00</span>
          </div>
          <div class="flex justify-between text-base font-bold text-[#58111A] pt-2 border-t border-[#C5A059]/20">
            <span>Total Payable</span>
            <span id="totalAmount">₹0.00</span>
          </div>
        </div>

        <!-- Order Type Selection -->
        <div class="grid grid-cols-2 gap-2 text-[10px] font-bold uppercase tracking-wider">
          <label class="border border-[#C5A059]/40 bg-[#FDFBF7] p-2 flex items-center justify-center gap-1 cursor-pointer">
            <input type="radio" name="orderType" value="dinein" checked class="accent-[#58111A]"> Dine-In
          </label>
          <label class="border border-[#C5A059]/40 bg-[#FDFBF7] p-2 flex items-center justify-center gap-1 cursor-pointer">
            <input type="radio" name="orderType" value="takeaway" class="accent-[#58111A]"> Takeaway
          </label>
        </div>

        <!-- Primary Actions -->
        <button onclick="checkout()" class="w-full bg-[#58111A] hover:bg-[#3D0B12] text-[#FDFBF7] border border-[#C5A059] py-3.5 text-xs uppercase font-bold tracking-widest transition duration-200 shadow-md">
          Print & Complete Order
        </button>
      </div>

    </div>

  </main>

  <!-- Complete Billing JavaScript -->
  <script>
    // Master Menu Items Database
    const menuDatabase = [
      { id: "M01", category: "Chef Special", name: "Stuff Kurkure Chaap", price: 500, veg: true },
      { id: "M02", category: "Chef Special", name: "Stuff Tandoori Mushroom", price: 500, veg: true },
      { id: "M03", category: "Chef Special", name: "Cheese Mushroom Duplex", price: 500, veg: true },
      { id: "M04", category: "Chef Special", name: "Sharabi Tikka With Egg", price: 550, veg: false },
      { id: "M05", category: "Chef Special", name: "Bhatti Chicken Barra", price: 550, veg: false },
      { id: "M06", category: "Chef Special", name: "Chicken Rada Gravy", price: 600, veg: false },
      { id: "M07", category: "Tandoori & Grills", name: "Paneer Tikka (Achari/Haryali)", price: 400, veg: true },
      { id: "M08", category: "Tandoori & Grills", name: "Tandoori Chaap (Malai/Kurkure)", price: 400, veg: true },
      { id: "M09", category: "Tandoori & Grills", name: "Tandoori Pineapple", price: 400, veg: true },
      { id: "M10", category: "Tandoori & Grills", name: "Tandoori Chicken Tikka", price: 500, veg: false },
      { id: "M11", category: "Tandoori & Grills", name: "Sharbati Chicken Tikka", price: 600, veg: false },
      { id: "M12", category: "Main Course", name: "Dal Makhani", price: 450, veg: true },
      { id: "M13", category: "Main Course", name: "Paneer Lababdar", price: 450, veg: true },
      { id: "M14", category: "Main Course", name: "Rogan Josh (4 pcs.)", price: 750, veg: false },
      { id: "M15", category: "Main Course", name: "Kashmiri Gosh Tabba with Rice", price: 900, veg: false },
      { id: "M16", category: "Beverages", name: "Mojito Pitcher", price: 250, veg: true }
    ];

    let cart = [];
    let selectedCategory = "ALL";

    // Initial Load
    window.onload = function() {
      renderGrid(menuDatabase);
      updateCartUI();
    };

    // Render Grid Cards
    function renderGrid(items) {
      const container = document.getElementById('itemsGrid');
      
      if (items.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-xs text-[#1A1A1A]/50 py-12">No menu items found</p>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div onclick="addToCart('${item.id}')" 
             class="bg-[#FDFBF7] border border-[#C5A059]/40 hover:border-[#58111A] p-4 cursor-pointer transition-all duration-200 flex flex-col justify-between shadow-sm hover:shadow-md group">
          <div>
            <div class="flex justify-between items-start gap-1">
              <h3 class="font-serif-classic font-bold text-xs text-[#58111A] group-hover:text-[#3D0B12]">${item.name}</h3>
              <span class="text-[9px] ${item.veg ? 'text-emerald-700' : 'text-rose-700'} font-bold shrink-0">
                ${item.veg ? '🟢' : '🔴'}
              </span>
            </div>
            <p class="text-[9px] text-[#C5A059] font-bold uppercase tracking-wider mt-1">${item.category}</p>
          </div>
          <div class="mt-4 pt-2 border-t border-[#C5A059]/20 flex justify-between items-center">
            <span class="text-xs font-bold text-[#1A1A1A]">₹${item.price.toFixed(2)}</span>
            <button class="bg-[#C5A059]/20 text-[#58111A] group-hover:bg-[#58111A] group-hover:text-[#FDFBF7] font-bold text-xs w-6 h-6 flex items-center justify-center border border-[#C5A059] transition">+ </button>
          </div>
        </div>
      `).join('');
    }

    // Filter Logic
    function filterCategory(cat) {
      selectedCategory = cat;
      
      // Button Highlight Style update
      document.querySelectorAll('#categoryBar button').forEach(btn => {
        btn.classList.remove('bg-[#58111A]', 'text-[#FDFBF7]', 'border-[#C5A059]');
        btn.classList.add('border-[#C5A059]/40', 'text-[#1A1A1A]');
      });
      event.target.classList.add('bg-[#58111A]', 'text-[#FDFBF7]', 'border-[#C5A059]');

      handleSearch();
    }

    // Search Input Logic
    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = menuDatabase.filter(item => {
        const matchesCategory = selectedCategory === "ALL" || item.category === selectedCategory;
        const matchesQuery = item.name.toLowerCase().includes(query) || item.id.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      renderGrid(filtered);
    }

    // Add Item to Cart
    function addToCart(id) {
      const item = menuDatabase.find(i => i.id === id);
      const existing = cart.find(c => c.id === id);
      
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
    }

    // Update Item Quantity (+ / -)
    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if (!item) return;

      item.qty += delta;

      if (item.qty <= 0) {
        cart = cart.filter(c => c.id !== id);
      }
      updateCartUI();
    }

    // Update Cart Panel UI & Calculations
    function updateCartUI() {
      const container = document.getElementById('cartContainer');

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-xs text-center text-[#1A1A1A]/40 py-12 italic">No items in active bill</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="bg-[#FDFBF7] border border-[#C5A059]/40 p-2.5 flex justify-between items-center shadow-sm">
            <div class="flex-1 pr-2">
              <h4 class="font-bold text-xs text-[#1A1A1A]">${item.name}</h4>
              <p class="text-[10px] text-[#C5A059] font-medium">₹${item.price} × ${item.qty} = ₹${(item.price * item.qty).toFixed(2)}</p>
            </div>

            <!-- Plus Minus Controls -->
            <div class="flex items-center border border-[#C5A059] bg-[#FAF6F0] shrink-0">
              <button onclick="changeQty('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center font-bold text-[#58111A] hover:bg-[#C5A059]/20 transition">-</button>
              <span class="w-6 text-center font-bold text-xs text-[#1A1A1A]">${item.qty}</span>
              <button onclick="changeQty('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center font-bold text-[#58111A] hover:bg-[#C5A059]/20 transition">+</button>
            </div>
          </div>
        `).join('');
      }

      // Calculations
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const tax = subtotal * 0.05; // 5% GST
      const total = subtotal + tax;

      document.getElementById('subtotalAmount').innerText = `₹${subtotal.toFixed(2)}`;
      document.getElementById('taxAmount').innerText = `₹${tax.toFixed(2)}`;
      document.getElementById('totalAmount').innerText = `₹${total.toFixed(2)}`;
    }

    // Reset Cart
    function clearCart() {
      if(cart.length === 0) return;
      cart = [];
      updateCartUI();
    }

    // Complete Checkout Action
    function checkout() {
      if (cart.length === 0) {
        alert("Pehle cart mein items add karein!");
        return;
      }
      
      const totalVal = document.getElementById('totalAmount').innerText;
      alert(`Order Placed Successfully!\nTotal Bill Amount: ${totalVal}\nSent to KDS System.`);
      
      cart = [];
      updateCartUI();
    }
  </script>
</body>
</html>
