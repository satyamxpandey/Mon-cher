<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing POS - Moncher Luxury Lounge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #FDFBF7; color: #1A1A1A; }
    .font-serif-classic { font-family: 'Playfair Display', serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #FAF6F0; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5A059; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-[#FDFBF7]">

  <!-- Top Executive Header -->
  <header class="bg-[#FDFBF7] border-b-2 border-[#C5A059]/40 px-8 py-3.5 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 border border-[#C5A059] bg-[#58111A] flex items-center justify-center text-[#FDFBF7] font-serif-classic font-bold text-xl shadow-md">M</div>
      <div>
        <h1 class="font-serif-classic text-xl font-bold text-[#58111A] tracking-wider uppercase">MONCHER POS</h1>
        <p class="text-[10px] tracking-widest text-[#C5A059] uppercase font-semibold">Counter Billing & Register</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="text-right">
        <p class="text-xs font-bold text-[#58111A]">TERMINAL #01</p>
        <p class="text-[10px] text-[#1A1A1A]/60">Status: Active</p>
      </div>
      <span class="w-3 h-3 rounded-full bg-emerald-600 border border-[#C5A059]"></span>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden">
    <!-- Menu Grid Area -->
    <div class="flex-1 p-6 overflow-y-auto custom-scrollbar flex flex-col gap-5">
      <div class="flex flex-col sm:flex-row gap-3 justify-between items-center border-b border-[#C5A059]/30 pb-4">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search item..." class="w-full sm:w-80 bg-[#FAF6F0] border border-[#C5A059]/60 px-4 py-2 text-xs focus:outline-none focus:border-[#58111A]">
        <div class="flex gap-1.5 overflow-x-auto w-full sm:w-auto" id="categoryBar">
          <button onclick="filterCategory('ALL')" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3.5 py-1.5 text-[11px] font-semibold uppercase">All Items</button>
          <button onclick="filterCategory('Chef Special')" class="border border-[#C5A059]/40 px-3.5 py-1.5 text-[11px] font-semibold uppercase">Chef Special</button>
          <button onclick="filterCategory('Tandoori & Grills')" class="border border-[#C5A059]/40 px-3.5 py-1.5 text-[11px] font-semibold uppercase">Grills</button>
          <button onclick="filterCategory('Main Course')" class="border border-[#C5A059]/40 px-3.5 py-1.5 text-[11px] font-semibold uppercase">Mains</button>
        </div>
      </div>
      <div id="itemsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <!-- Billing Sidebar -->
    <div class="w-96 bg-[#FAF6F0] border-l-2 border-[#C5A059]/40 p-6 flex flex-col justify-between shadow-xl">
      <div class="space-y-4 flex-1 flex flex-col overflow-hidden">
        <div class="flex justify-between items-center border-b border-[#C5A059]/40 pb-3">
          <div>
            <h2 class="font-serif-classic text-lg font-bold text-[#58111A]">Current Order</h2>
            <p class="text-[10px] text-[#C5A059] font-bold uppercase">Counter Bill</p>
          </div>
          <button onclick="clearCart()" class="text-[10px] text-rose-800 uppercase font-bold underline">Clear All</button>
        </div>
        <div id="cartContainer" class="space-y-3 overflow-y-auto flex-1 pr-1 custom-scrollbar"></div>
      </div>

      <div class="border-t border-[#C5A059]/40 pt-4 space-y-3 shrink-0">
        <div class="space-y-1.5 text-xs">
          <div class="flex justify-between text-[#1A1A1A]/70"><span>Subtotal</span><span id="subtotalAmount">₹0.00</span></div>
          <div class="flex justify-between text-[#1A1A1A]/70"><span>GST (5%)</span><span id="taxAmount">₹0.00</span></div>
          <div class="flex justify-between text-base font-bold text-[#58111A] pt-2 border-t border-[#C5A059]/20">
            <span>Total Payable</span><span id="totalAmount">₹0.00</span>
          </div>
        </div>
        <button onclick="checkout()" class="w-full bg-[#58111A] hover:bg-[#3D0B12] text-[#FDFBF7] border border-[#C5A059] py-3.5 text-xs uppercase font-bold tracking-widest transition">
          Print & Complete Order
        </button>
      </div>
    </div>
  </main>

  <script>
    const menuDatabase = [
      { id: "M01", category: "Chef Special", name: "Stuff Kurkure Chaap", price: 500 },
      { id: "M02", category: "Chef Special", name: "Stuff Tandoori Mushroom", price: 500 },
      { id: "M03", category: "Chef Special", name: "Cheese Mushroom Duplex", price: 500 },
      { id: "M04", category: "Tandoori & Grills", name: "Bhatti Chicken Barra", price: 550 },
      { id: "M05", category: "Tandoori & Grills", name: "Sharabi Tikka With Egg", price: 550 },
      { id: "M06", category: "Main Course", name: "Dal Makhani", price: 450 },
      { id: "M07", category: "Main Course", name: "Paneer Lababdar", price: 450 },
      { id: "M08", category: "Main Course", name: "Rogan Josh (4 pcs.)", price: 750 }
    ];

    let cart = [];
    let selectedCategory = "ALL";

    window.onload = function() { renderGrid(menuDatabase); updateCartUI(); };

    function renderGrid(items) {
      document.getElementById('itemsGrid').innerHTML = items.map(item => `
        <div onclick="addToCart('${item.id}')" class="bg-[#FDFBF7] border border-[#C5A059]/40 hover:border-[#58111A] p-4 cursor-pointer transition flex flex-col justify-between group">
          <div>
            <h3 class="font-serif-classic font-bold text-xs text-[#58111A]">${item.name}</h3>
            <p class="text-[9px] text-[#C5A059] font-bold uppercase mt-1">${item.category}</p>
          </div>
          <div class="mt-4 pt-2 border-t border-[#C5A059]/20 flex justify-between items-center">
            <span class="text-xs font-bold">₹${item.price}</span>
            <span class="bg-[#C5A059]/20 text-[#58111A] font-bold text-xs w-6 h-6 flex items-center justify-center border border-[#C5A059]">+</span>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = menuDatabase.filter(item => 
        (selectedCategory === "ALL" || item.category === selectedCategory) &&
        (item.name.toLowerCase().includes(q))
      );
      renderGrid(filtered);
    }

    function addToCart(id) {
      const item = menuDatabase.find(i => i.id === id);
      const exist = cart.find(c => c.id === id);
      if(exist) exist.qty++; else cart.push({...item, qty: 1});
      updateCartUI();
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if(!item) return;
      item.qty += delta;
      if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      const container = document.getElementById('cartContainer');
      if (!cart.length) {
        container.innerHTML = `<p class="text-xs text-center text-[#1A1A1A]/40 py-12 italic">No items in cart</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="bg-[#FDFBF7] border border-[#C5A059]/40 p-2.5 flex justify-between items-center">
            <div class="flex-1 pr-2">
              <h4 class="font-bold text-xs">${item.name}</h4>
              <p class="text-[10px] text-[#C5A059]">₹${item.price} × ${item.qty} = ₹${item.price * item.qty}</p>
            </div>
            <div class="flex items-center border border-[#C5A059] bg-[#FAF6F0]">
              <button onclick="changeQty('${item.id}', -1)" class="w-6 h-6 font-bold text-[#58111A]">-</button>
              <span class="w-6 text-center font-bold text-xs">${item.qty}</span>
              <button onclick="changeQty('${item.id}', 1)" class="w-6 h-6 font-bold text-[#58111A]">+</button>
            </div>
          </div>
        `).join('');
      }

      const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const tax = subtotal * 0.05;
      document.getElementById('subtotalAmount').innerText = `₹${subtotal.toFixed(2)}`;
      document.getElementById('taxAmount').innerText = `₹${tax.toFixed(2)}`;
      document.getElementById('totalAmount').innerText = `₹${(subtotal + tax).toFixed(2)}`;
    }

    function clearCart() { cart = []; updateCartUI(); }
    function checkout() {
      if(!cart.length) return alert('Cart empty!');
      alert('Order Processed and sent to KDS Screen!');
      clearCart();
    }
  </script>
</body>
</html>
