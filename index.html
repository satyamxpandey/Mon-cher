<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing POS - Moncher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #FDFBF7; color: #1A1A1A; }
    .serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
  <header class="bg-[#FDFBF7] border-b-2 border-[#C5A059]/40 px-6 py-3 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] flex items-center justify-center font-bold serif">M</div>
      <h1 class="serif text-lg font-bold text-[#58111A]">MONCHER POS & BILLING</h1>
    </div>
    <span class="text-xs font-semibold px-3 py-1 bg-[#FAF6F0] border border-[#C5A059] text-[#58111A]">COUNTER #01</span>
  </header>

  <main class="flex-1 flex overflow-hidden">
    <!-- Menu Grid -->
    <div class="flex-1 p-6 overflow-y-auto space-y-4">
      <input type="text" id="search" oninput="renderItems()" placeholder="Search item..." class="w-full bg-[#FAF6F0] border border-[#C5A059]/50 p-2.5 text-xs focus:outline-none focus:border-[#58111A]">
      <div id="grid" class="grid grid-cols-3 gap-3"></div>
    </div>

    <!-- Billing Sidebar -->
    <div class="w-96 bg-[#FAF6F0] border-l-2 border-[#C5A059]/40 p-6 flex flex-col justify-between">
      <div class="space-y-4">
        <h2 class="serif text-lg font-bold text-[#58111A] border-b border-[#C5A059]/30 pb-2">Current Bill</h2>
        <div id="cart" class="space-y-2 max-h-96 overflow-y-auto text-xs"></div>
      </div>
      <div class="border-t border-[#C5A059]/40 pt-4 space-y-3">
        <div class="flex justify-between font-bold text-base text-[#58111A]">
          <span>Total Payable</span>
          <span id="total">₹0.00</span>
        </div>
        <button onclick="checkout()" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-3 text-xs uppercase font-bold tracking-widest hover:bg-[#3D0B12]">
          Print & Complete Order
        </button>
      </div>
    </div>
  </main>

  <script>
    const items = [
      { id: 1, name: "Stuff Kurkure Chaap", price: 500 },
      { id: 2, name: "Stuff Tandoori Mushroom", price: 500 },
      { id: 3, name: "Cheese Mushroom Duplex", price: 500 },
      { id: 4, name: "Bhatti Chicken Barra", price: 550 },
      { id: 5, name: "Dal Makhani", price: 450 },
      { id: 6, name: "Paneer Lababdar", price: 450 },
      { id: 7, name: "Rogan Josh", price: 750 }
    ];
    let cart = [];

    function renderItems() {
      const q = document.getElementById('search').value.toLowerCase();
      document.getElementById('grid').innerHTML = items
        .filter(i => i.name.toLowerCase().includes(q))
        .map(i => `
          <div onclick="add(${i.id})" class="bg-[#FDFBF7] border border-[#C5A059]/40 p-3 hover:border-[#58111A] cursor-pointer">
            <p class="font-bold text-xs">${i.name}</p>
            <p class="text-[10px] text-[#C5A059] font-semibold mt-1">₹${i.price}</p>
          </div>
        `).join('');
    }

    function add(id) {
      const item = items.find(i => i.id === id);
      const exist = cart.find(c => c.id === id);
      if(exist) exist.qty++; else cart.push({...item, qty: 1});
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart').innerHTML = cart.map(c => `
        <div class="flex justify-between border-b border-[#C5A059]/20 pb-1">
          <span>${c.name} (x${c.qty})</span>
          <span class="font-bold text-[#58111A]">₹${c.price * c.qty}</span>
        </div>
      `).join('');
      const tot = cart.reduce((s, c) => s + (c.price * c.qty), 0);
      document.getElementById('total').innerText = `₹${tot.toFixed(2)}`;
    }

    function checkout() {
      if(!cart.length) return alert('Cart is empty!');
      alert('Order sent to Kitchen!');
      cart = []; updateCart();
    }
    renderItems();
  </script>
</body>
</html>
