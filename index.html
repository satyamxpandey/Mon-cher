<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mon Cher - Admin Analytics</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 30px; }
        h1 { color: #D4AF37; }
        .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
        .card { background: #1E1E1E; padding: 20px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .val { font-size: 2rem; color: #D4AF37; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Mon Cher Owner Analytics</h1>
    <div class="metrics">
        <div class="card">Today Sales<div class="val" id="todayRev">₹0</div></div>
        <div class="card">Total Orders<div class="val" id="todayOrders">0</div></div>
        <div class="card">Cash Sales<div class="val" id="cashRev">₹0</div></div>
        <div class="card">Razorpay Sales<div class="val" id="rzpRev">₹0</div></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxkwNfmiY6-zlj2cVmet56-o2S4O-n9skVIuBGVN-wZxXAl2NQwlI_7Cbu4Nej45Ig8/exec";

        async function loadAnalytics() {
            const res = await fetch(`${API_URL}?action=getAdminAnalytics`);
            const json = await res.json();
            const a = json.analytics;
            document.getElementById('todayRev').innerText = `₹${a.todayRevenue}`;
            document.getElementById('todayOrders').innerText = a.todayOrdersCount;
            document.getElementById('cashRev').innerText = `₹${a.cashRevenue}`;
            document.getElementById('rzpRev').innerText = `₹${a.razorpayRevenue}`;
        }
        loadAnalytics();
    </script>
</body>
</html>
