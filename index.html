<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONCHER - Restaurant Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lato', sans-serif; background: #FDFBF7; color: #1A1A1A; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #FAF6F0; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="bg-[#FDFBF7] border-b-2 border-[#C5A059]/40 px-6 py-3 flex justify-between items-center shadow-sm shrink-0">
    <div>
      <h1 class="text-xl font-bold text-[#58111A] tracking-widest uppercase">MONCHER</h1>
      <p class="text-[9px] text-[#C5A059] uppercase tracking-widest font-semibold">Fine Dining & Lounge</p>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="text-right">
        <span class="text-[10px] text-gray-500 uppercase font-bold">Active Working Date:</span>
        <span id="activeDateBadge" class="text-xs font-bold text-[#58111A] ml-1 bg-[#FAF6F0] px-2 py-0.5 border border-[#C5A059]/40">Loading...</span>
      </div>
      <nav class="flex gap-2">
        <button onclick="switchTab('billing')" id="tab-billing" class="px-4 py-1.5 text-xs font-bold uppercase tracking-wider border border-[#C5A059] bg-[#58111A] text-[#FDFBF7]">Billing & POS</button>
        <button onclick="switchTab('dayend')" id="tab-dayend" class="px-4 py-1.5 text-xs font-bold uppercase tracking-wider border border-[#C5A059]/40 text-[#58111A] hover:bg-[#FAF6F0]">Day Management</button>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="flex-1 overflow-hidden">
    
    <!-- 1. BILLING & POS SECTION -->
    <section id="sec-billing" class="h-full grid grid-cols-12 gap-4 p-4 overflow-hidden">
      <div class="col-span-7 flex flex-col bg-[#FAF6F0] border border-[#C5A059]/40 p-4 overflow-hidden rounded-sm shadow-sm">
        <div class="flex gap-2 mb-4 overflow-x-auto pb-3 border-b-2 border-[#C5A059]/30 shrink-0" id="categoryTabs">
          <button onclick="filterPosCat('ALL')" class="pos-cat-btn bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-4 py-1.5 text-xs font-bold uppercase whitespace-nowrap">All Items</button>
        </div>
        <div id="posMenuList" class="grid grid-cols-2 gap-3 overflow-y-auto pr-1 flex-1 align-content-start">
          <p class="text-xs text-gray-500 col-span-2 text-center py-10">Connecting to Google Sheet Database...</p>
        </div>
      </div>

      <!-- Current Order Cart -->
      <div class="col-span-5 flex flex-col bg-[#FDFBF7] border-2 border-[#C5A059] p-4 shadow-sm">
        <h2 class="text-base font-bold text-[#58111A] uppercase border-b border-[#C5A059]/30 pb-2">Current Order</h2>
        <div class="my-3 flex items-center justify-between bg-[#FAF6F0] p-2 border border-[#C5A059]/30">
          <label class="text-xs font-bold text-[#58111A] uppercase">Table Number:</label>
          <input type="number" id="posTableNo" placeholder="e.g. 05" class="w-24 border border-[#C5A059] px-2 py-1 text-xs font-bold bg-[#FDFBF7] text-[#58111A] outline-none text-center">
        </div>

        <div id="posCartList" class="flex-1 overflow-y-auto space-y-2 pr-1 border-b border-[#C5A059]/30 py-2">
          <p class="text-xs text-center text-gray-400 py-10">No items added to order</p>
        </div>

        <div class="pt-3 space-y-2 shrink-0">
          <div class="flex justify-between items-center text-xs font-bold text-[#58111A] bg-[#FAF6F0] p-2 border border-[#C5A059]/20">
            <span>Total Payable</span>
            <span id="posTotalSum" class="text-base text-[#58111A]">₹0.00</span>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="clearPosCart()" class="border border-[#58111A] text-[#58111A] py-2 text-xs font-bold uppercase hover:bg-red-50">Clear Cart</button>
            <button onclick="sendToKitchen()" id="btnSendKds" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-2 text-xs font-bold uppercase hover:bg-[#3D0B12] shadow-sm">Send To Kitchen KDS</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. DAY MANAGEMENT SECTION -->
    <section id="sec-dayend" class="h-full p-8 hidden bg-[#FAF6F0] flex items-center justify-center">
      <div class="bg-[#FDFBF7] border-2 border-[#C5A059] p-6 max-w-md w-full shadow-lg space-y-4">
        <h2 class="text-lg font-bold text-[#58111A] uppercase border-b border-[#C5A059]/40 pb-2">Business Day Closing & Rollover</h2>
        <div>
          <label class="block text-xs font-bold text-[#58111A] uppercase mb-1">Enter Next Working Date:</label>
          <input type="date" id="nextActiveDate" class="w-full bg-[#FAF6F0] border border-[#C5A059] p-2 text-xs font-bold text-[#58111A]">
        </div>
        <div>
          <label class="block text-xs font-bold text-[#58111A] uppercase mb-1">Closing Notes / Remarks:</label>
          <input type="text" id="closingNotes" placeholder="Standard Shift Close" class="w-full bg-[#FAF6F0] border border-[#C5A059] p-2 text-xs text-[#58111A]">
        </div>
        <button onclick="confirmDayRollover()" class="w-full bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] py-2.5 text-xs font-bold uppercase hover:bg-[#3D0B12]">
          Close Current Day & Set New Date
        </button>
      </div>
    </section>

  </main>

  <script>
    let menuDatabase = [];
    let posCart = [];
    let currentPosCategory = "ALL";
    let activeWorkingDate = "";

    window.onload = function() {
      loadInitialSystemData();
    };

    function loadInitialSystemData() {
      google.script.run
        .withSuccessHandler(function(data) {
          menuDatabase = data.menu;
          activeWorkingDate = data.currentDate;
          document.getElementById('activeDateBadge').innerText = activeWorkingDate;
          buildCategoryTabs();
          renderPosMenu();
        })
        .withFailureHandler(function(err) {
          alert("Error fetching data: " + err.message);
        })
        .getInitialData();
    }

    function buildCategoryTabs() {
      const categories = ["ALL", ...new Set(menuDatabase.map(item => item.category))];
      const container = document.getElementById('categoryTabs');
      container.innerHTML = categories.map(cat => `
        <button onclick="filterPosCat('${cat}')" id="pos-cat-${cat}" class="pos-cat-btn ${cat === 'ALL' ? 'bg-[#58111A] text-[#FDFBF7]' : 'bg-[#FDFBF7] text-[#58111A]'} border border-[#C5A059]/40 px-4 py-1.5 text-xs font-bold uppercase whitespace-nowrap">${cat}</button>
      `).join('');
    }

    function switchTab(tab) {
      document.getElementById('sec-billing').classList.toggle('hidden', tab !== 'billing');
      document.getElementById('sec-dayend').classList.toggle('hidden', tab !== 'dayend');
      document.getElementById('tab-billing').className = tab === 'billing' ? "px-4 py-1.5 text-xs font-bold uppercase border border-[#C5A059] bg-[#58111A] text-[#FDFBF7]" : "px-4 py-1.5 text-xs font-bold uppercase border border-[#C5A059]/40 text-[#58111A]";
      document.getElementById('tab-dayend').className = tab === 'dayend' ? "px-4 py-1.5 text-xs font-bold uppercase border border-[#C5A059] bg-[#58111A] text-[#FDFBF7]" : "px-4 py-1.5 text-xs font-bold uppercase border border-[#C5A059]/40 text-[#58111A]";
    }

    function filterPosCat(cat) {
      currentPosCategory = cat;
      document.querySelectorAll('.pos-cat-btn').forEach(b => {
        b.className = "pos-cat-btn bg-[#FDFBF7] text-[#58111A] border border-[#C5A059]/40 px-4 py-1.5 text-xs font-bold uppercase whitespace-nowrap";
      });
      const activeBtn = document.getElementById(`pos-cat-${cat}`);
      if(activeBtn) activeBtn.className = "pos-cat-btn bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-4 py-1.5 text-xs font-bold uppercase whitespace-nowrap shadow-sm";
      renderPosMenu();
    }

    function renderPosMenu() {
      const container = document.getElementById('posMenuList');
      const filtered = menuDatabase.filter(i => currentPosCategory === "ALL" || i.category === currentPosCategory);

      container.innerHTML = filtered.map(item => {
        const cartItem = posCart.find(c => c.id === item.id);
        const qty = cartItem ? cartItem.qty : 0;
        return `
          <div class="bg-[#FDFBF7] border border-[#C5A059]/40 p-3 flex flex-col justify-between hover:border-[#58111A] transition-all shadow-sm rounded-sm">
            <div>
              <h4 class="font-bold text-xs text-[#58111A] leading-snug">${item.name}</h4>
              <p class="text-[9px] text-[#C5A059] font-bold uppercase mt-1 tracking-wider">${item.category}</p>
            </div>
            <div class="flex justify-between items-center mt-3 pt-2 border-t border-[#C5A059]/20">
              <p class="font-bold text-xs text-[#1A1A1A]">₹${item.price.toFixed(2)}</p>
              ${qty > 0 ? `
                <div class="flex items-center border border-[#C5A059] bg-[#FAF6F0]">
                  <button onclick="changePosQty('${item.id}', -1)" class="w-6 h-6 font-bold text-[#58111A]">-</button>
                  <span class="w-6 text-center font-bold text-xs text-[#58111A]">${qty}</span>
                  <button onclick="changePosQty('${item.id}', 1)" class="w-6 h-6 font-bold text-[#58111A]">+</button>
                </div>
              ` : `
                <button onclick="addPosItem('${item.id}')" class="bg-[#58111A] text-[#FDFBF7] border border-[#C5A059] px-3 py-1 text-[11px] font-bold uppercase hover:bg-[#3D0B12]">
                  + Add
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function addPosItem(id) {
      const item = menuDatabase.find(i => i.id === id);
      const exist = posCart.find(c => c.id === id);
      if(exist) exist.qty++; else posCart.push({...item, qty: 1});
      renderPosMenu();
      renderPosCart();
    }

    function changePosQty(id, delta) {
      const item = posCart.find(c => c.id === id);
      if(!item) return;
      item.qty += delta;
      if(item.qty <= 0) posCart = posCart.filter(c => c.id !== id);
      renderPosMenu();
      renderPosCart();
    }

    function renderPosCart() {
      const container = document.getElementById('posCartList');
      if(posCart.length === 0) {
        container.innerHTML = `<p class="text-xs text-center text-gray-400 py-10">No items added to order</p>`;
        document.getElementById('posTotalSum').innerText = `₹0.00`;
        return;
      }
      container.innerHTML = posCart.map(c => `
        <div class="flex justify-between items-center bg-[#FAF6F0] p-2 border border-[#C5A059]/30 text-xs">
          <div class="flex-1 pr-2">
            <p class="font-bold text-[#58111A]">${c.name}</p>
            <p class="text-[10px] text-gray-500">₹${c.price} × ${c.qty}</p>
          </div>
          <div class="flex items-center border border-[#C5A059] bg-[#FDFBF7] mr-2">
            <button onclick="changePosQty('${c.id}', -1)" class="w-5 h-5 font-bold text-[#58111A]">-</button>
            <span class="w-5 text-center font-bold text-[11px]">${c.qty}</span>
            <button onclick="changePosQty('${c.id}', 1)" class="w-5 h-5 font-bold text-[#58111A]">+</button>
          </div>
          <span class="font-bold text-[#58111A]">₹${(c.price * c.qty).toFixed(2)}</span>
        </div>
      `).join('');

      const total = posCart.reduce((s, c) => s + (c.price * c.qty), 0);
      document.getElementById('posTotalSum').innerText = `₹${total.toFixed(2)}`;
    }

    function clearPosCart() {
      posCart = [];
      document.getElementById('posTableNo').value = '';
      renderPosMenu();
      renderPosCart();
    }

    function sendToKitchen() {
      const tbl = document.getElementById('posTableNo').value;
      if(!tbl) { alert('Please specify a Table Number.'); return; }
      if(posCart.length === 0) { alert('Cart is empty.'); return; }

      const total = posCart.reduce((s, c) => s + (c.price * c.qty), 0);
      const btn = document.getElementById('btnSendKds');
      btn.innerText = "Syncing Sheet...";
      btn.disabled = true;

      const orderPayload = {
        table: tbl,
        items: posCart,
        total: total
      };

      google.script.run
        .withSuccessHandler(function(res) {
          alert(`Order ${res.orderId} dispatched to Sheet & Kitchen!`);
          btn.innerText = "Send To Kitchen KDS";
          btn.disabled = false;
          clearPosCart();
        })
        .withFailureHandler(function(err) {
          alert("Order failed: " + err.message);
          btn.innerText = "Send To Kitchen KDS";
          btn.disabled = false;
        })
        .submitNewOrder(orderPayload);
    }

    function confirmDayRollover() {
      const nextDate = document.getElementById('nextActiveDate').value;
      const notes = document.getElementById('closingNotes').value;
      if(!nextDate) { alert('Please select a date to rollover.'); return; }

      if(confirm(`Lock current ledger and rollover active POS date to: ${nextDate}?`)) {
        google.script.run
          .withSuccessHandler(function(res) {
            alert(`Business date updated to ${res.activeDate}.`);
            location.reload();
          })
          .executeDayCloseAndSetNext(nextDate, notes);
      }
    }
  </script>
</body>
</html>
